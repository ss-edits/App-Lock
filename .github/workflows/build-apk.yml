name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Prepare Web Assets & Install Dependencies
      run: |
        mkdir -p www
        cp index.html styles.css manifest.json sw.js www/ || true
        cp -r js www/ || true
        npm install
        npx cap sync android

    - name: Build Android Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
        cp app/build/outputs/apk/debug/app-debug.apk ../AppLock.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AppLock-Android-APK
        path: AppLock.apk

    - name: Create Official GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v1.0.${{ github.run_number }}"
        name: "App Lock Native APK v1.0.${{ github.run_number }}"
        body: |
          🚀 Direct 1-click download link for App Lock native Android APK.
          Download AppLock.apk directly to your phone and tap to install!
        files: AppLock.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
