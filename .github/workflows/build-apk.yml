name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies & Sync
      run: |
        npm install
        npx cap sync android

    - name: Build Android Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
        cp app/build/outputs/apk/debug/app-debug.apk ../AppLock.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AppLock-Android-APK
        path: AppLock.apk

    - name: Publish Direct APK to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: App Lock Native APK v1.0.${{ github.run_number }}
        body: |
          🚀 Direct download link for App Lock native Android APK.
          Download and tap AppLock.apk directly on your Android phone to install!
        files: AppLock.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
